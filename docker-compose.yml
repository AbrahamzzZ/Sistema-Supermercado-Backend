services:
  api:
    build: 
        context: .
        dockerfile: ./APIRestSistemaVentas/Dockerfile
    container_name: api-ventas
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - CONNECTION_STRING=Data Source=192.168.100.133,1433;Initial Catalog=Sistema_Supermercado;User Id=user_sistema_venta;Password=ApiSistemaVenta;TrustServerCertificate=True;
      - OLLAMA_BASE_URL=http://ollama:11434  
    depends_on:
      - ollama
    restart: unless-stopped

  # Ollama con Phi-3.5
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: ollama-api
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped

volumes:
  ollama_models:
    driver: local
