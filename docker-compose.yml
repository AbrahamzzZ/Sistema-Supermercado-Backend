services:
  api:
    build:
        context: .
        dockerfile: ./APIRestSistemaVentas/Dockerfile
    container_name: api-ventas
    ports:
      - "8081:8080"
    # Los valores salen del archivo .env (ver .env.example).
    # Usan la misma clave que appsettings: "__" equivale a ":" (Ollama__Model = Ollama:Model).
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CadenaSQL=${DB_CONNECTION_STRING:?Falta DB_CONNECTION_STRING en .env}
      - Jwt__Key=${JWT_KEY:?Falta JWT_KEY en .env}
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__Model=${OLLAMA_MODEL:-phi3.5}
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: ollama-api
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      # Mismo modelo que usa la API
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3.5}
    restart: unless-stopped

volumes:
  ollama_models:
    driver: local
